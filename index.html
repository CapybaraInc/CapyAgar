<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CapyAgar Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.game-wrapper{position:relative;width:100vw;height:100vh;max-width:500px;max-height:100vh;overflow:hidden;background:#1a1a2e;border:2px solid #2a2a3e}
canvas{display:block;position:absolute;top:0;left:0}
.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none}
.hud-score{background:rgba(0,0,0,0.75);color:#FFD700;padding:8px 18px;border-radius:20px;font-size:16px;font-weight:bold;border:1px solid rgba(255,215,0,0.3);backdrop-filter:blur(8px);text-align:center}
.leaderboard{position:absolute;top:60px;right:8px;background:rgba(0,0,0,0.8);border-radius:12px;padding:10px;z-index:10;pointer-events:none;border:1px solid rgba(255,255,255,0.2);min-width:110px;color:#ddd;font-size:9px}
.leaderboard-title{color:#FFD700;font-size:10px;font-weight:bold;text-align:center;margin-bottom:4px}
.leaderboard-item{display:flex;justify-content:space-between;padding:1px 4px}
.leaderboard-item.me{color:#FF8C00;font-weight:bold}
.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:18px;z-index:20;text-align:center;background:rgba(0,0,0,0.8);padding:20px 30px;border-radius:15px;display:none}
.status.visible{display:block}
</style>
</head>
<body>
<div class="game-wrapper" id="wrapper">
    <canvas id="canvas"></canvas>
    <div class="hud"><div class="hud-score">🍊 <span id="mass">10</span> | 🦫 <span id="players">1</span></div></div>
    <div class="leaderboard" id="leaderboard"><div class="leaderboard-title">🏆 Лидеры</div><div id="lbList"></div></div>
    <div class="status visible" id="status">Подключение...</div>
</div>

<script>
// ============================================
// CapyAgar Online Client
// ============================================
const wrapper = document.getElementById('wrapper');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const massEl = document.getElementById('mass');
const playersEl = document.getElementById('players');
const lbList = document.getElementById('lbList');
const statusEl = document.getElementById('status');

// ========== WebSocket ==========
const WS_URL = location.hostname === 'localhost' 
    ? 'ws://localhost:3000' 
    : `wss://${location.host}`;

let socket;
let myId = null;
let myColor = '#8B6914';
let myName = 'Капибара';
let gameState = { players: [], foods: [], leaderboard: [], worldWidth: 3000, worldHeight: 3000 };
let camera = { x: 0, y: 0 };
let mouse = { x: 0, y: 0 };
let connected = false;

function connect() {
    statusEl.textContent = '🔄 Подключение...';
    statusEl.classList.add('visible');
    
    socket = new WebSocket(WS_URL);

    socket.onopen = () => {
        console.log('✅ Подключено к серверу');
        statusEl.textContent = '🦫 Готово! Управляй мышью';
        setTimeout(() => statusEl.classList.remove('visible'), 1500);
        connected = true;
    };

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'init') {
            myId = msg.data.id;
            myColor = msg.data.color;
            myName = msg.data.name;
        } else if (msg.type === 'state') {
            gameState = msg.data;
        }
    };

    socket.onclose = () => {
        connected = false;
        statusEl.textContent = '❌ Соединение потеряно. Переподключение...';
        statusEl.classList.add('visible');
        setTimeout(connect, 2000);
    };

    socket.onerror = () => {
        statusEl.textContent = '⚠️ Сервер недоступен. Запусти server.js';
        statusEl.classList.add('visible');
    };
}

// ========== Отправка позиции мыши ==========
function sendMousePosition() {
    if (!connected || myId === null) return;
    const worldX = mouse.x + camera.x;
    const worldY = mouse.y + camera.y;
    socket.send(JSON.stringify({ type: 'move', x: worldX, y: worldY }));
}

// ========== Отрисовка ==========
function drawGrid() {
    const GRID = 50;
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const startX = Math.floor((camera.x % GRID) - GRID);
    const startY = Math.floor((camera.y % GRID) - GRID);
    for (let x = startX; x < canvas.width + GRID; x += GRID) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    for (let y = startY; y < canvas.height + GRID; y += GRID) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }
}

function drawCircle(x, y, r, color, isPlayer) {
    const sx = x - camera.x;
    const sy = y - camera.y;
    
    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.arc(sx+2, sy+2, r, 0, Math.PI*2); ctx.fill();
    
    // Тело
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = isPlayer ? 2.5 : 1.5;
    ctx.stroke();
    
    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(sx-r*0.3, sy-r*0.3, r*0.35, 0, Math.PI*2); ctx.fill();
    
    // Глаза (для игрока-капибары)
    if (isPlayer) {
        const eyeY = sy - r*0.2;
        const es = r*0.35;
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(sx-es, eyeY, r*0.22, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx+es, eyeY, r*0.22, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(sx-es, eyeY, r*0.12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx+es, eyeY, r*0.12, 0, Math.PI*2); ctx.fill();
        // Нос
        ctx.fillStyle = '#3a2000';
        ctx.beginPath(); ctx.arc(sx, sy+r*0.25, r*0.16, 0, Math.PI*2); ctx.fill();
        // Апельсин
        ctx.fillStyle = '#FF8C00';
        ctx.beginPath(); ctx.arc(sx, sy-r*0.7, r*0.18, 0, Math.PI*2); ctx.fill();
    }
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    // Еда
    gameState.foods.forEach(f => {
        const sx = f.x - camera.x;
        const sy = f.y - camera.y;
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(sx, sy, f.radius, 0, Math.PI*2); ctx.fill();
    });

    // Игроки
    gameState.players.forEach(p => {
        const r = Math.sqrt(p.mass) * 3;
        const isMe = p.id === myId;
        drawCircle(p.x, p.y, r, p.color, isMe);
        
        // Имя
        const sx = p.x - camera.x;
        const sy = p.y - camera.y;
        ctx.fillStyle = 'white';
        ctx.font = `bold ${Math.max(9,r*0.3)}px 'Segoe UI'`;
        ctx.textAlign = 'center';
        ctx.fillText(p.name, sx, sy - r - 6);
    });

    // HUD
    const me = gameState.players.find(p => p.id === myId);
    if (me) {
        massEl.textContent = Math.floor(me.mass);
        playersEl.textContent = gameState.players.length;
        
        // Камера
        const tx = me.x - canvas.width/2;
        const ty = me.y - canvas.height/2;
        camera.x += (tx - camera.x) * 0.1;
        camera.y += (ty - camera.y) * 0.1;
    }

    // Лидерборд
    let lb = '';
    gameState.leaderboard.forEach((p, i) => {
        lb += `<div class="leaderboard-item${p.id===myId?' me':''}"><span>${i+1}. ${p.name}</span><span>${p.mass}</span></div>`;
    });
    lbList.innerHTML = lb;
}

// ========== Игровой цикл ==========
function gameLoop() {
    draw();
    sendMousePosition();
    requestAnimationFrame(gameLoop);
}

// ========== Ввод ==========
function resize() {
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
}

wrapper.addEventListener('mousemove', e => {
    const rect = wrapper.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

wrapper.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    mouse.x = e.touches[0].clientX - rect.left;
    mouse.y = e.touches[0].clientY - rect.top;
}, {passive: false});

wrapper.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    mouse.x = e.touches[0].clientX - rect.left;
    mouse.y = e.touches[0].clientY - rect.top;
}, {passive: false});

window.addEventListener('resize', resize);

// ========== Старт ==========
resize();
connect();
gameLoop();
</script>
</body>
</html>
